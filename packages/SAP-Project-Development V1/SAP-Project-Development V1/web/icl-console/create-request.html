    state.sort={table:prefix,index:index,direction:localDir};applySortClass(prefix,index,localDir);return
  }
  var cols=prefix==="bank"?bankColumns:listColumns,rows=prefix==="bank"?DATA.banks:DATA.ottks,col=cols[index],direction;
  direction=state.sort.table===prefix&&state.sort.index===index&&state.sort.direction==="asc"?"desc":"asc";
  state.sort={table:prefix,index:index,direction:direction};rows.sort(function(a,b){var av=a[col.key],bv=b[col.key];
    if(col.number){av=Number(av||0);bv=Number(bv||0)}else{av=String(av||"").toLowerCase();bv=String(bv||"").toLowerCase()}
    if(av<bv){return direction==="asc"?-1:1}if(av>bv){return direction==="asc"?1:-1}return 0});

    '<td class="editable"><input id="iclStart" class="cell-input" type="text" value="'+esc(start)+'"></td>'+
    '<td class="editable"><input id="iclEnd" class="cell-input" type="text" value="'+esc(end)+'"></td>'+
    '<td class="editable"><select id="paymentMode" class="cell-select"><option>01 Pay to Group Co. (Indirect)</option><option>02 Pay Direct</option></select></td>'+
    '<td class="editable"><button id="paymentBankBtn" class="link-button" type="button">Select bank</button><span id="paymentBankText"></span></td>'+
    '<td><input id="requestNo" class="cell-input" type="text" readonly value="'+esc(state.requestNo)+'"></td>'+
    '<td class="icon-cell"><button id="createRequestBtn" class="btn btn-primary" type="button"'+    (state.requestNo?' disabled="disabled"':'')+'>Create</button></td></tr>';
  byId("iclStart").onchange=function(){this.value=normalizeDate(this.value);byId("iclEnd").value=addDays(this.value,10)};
  byId("iclEnd").onchange=function(){this.value=normalizeDate(this.value)};
  byId("paymentBankBtn").onclick=openBankModal;byId("createRequestBtn").onclick=createRequest;
  if(r.paymentBank){showPaymentBank(r.paymentBank)}bindTableSort()
}
function openBankModal(){
  state.selectedBank=-1;byId("bankSearch").value="";byId("bankSelect").disabled=true;renderBanks();
  byId("bankModal").className="modal-bg open"
}
function closeBankModal(){byId("bankModal").className="modal-bg"}
function renderBanks(){
  var q=byId("bankSearch").value.toLowerCase(),html="",i,j,r,c;byId("bankHead").innerHTML=headerHtml(bankColumns,"bank");
  for(i=0;i<DATA.banks.length;i++){r=DATA.banks[i];if(q&&JSON.stringify(r).toLowerCase().indexOf(q)<0){continue}html+='<tr data-bank="'+i+'">';
    for(j=0;j<bankColumns.length;j++){c=bankColumns[j];html+='<td>'+esc(r[c.key])+'</td>'}html+="</tr>"}byId("bankBody").innerHTML=html;bindTableSort()
}
function showPaymentBank(bank){
  var text=(bank.partnerBank||bank.houseBank)+" - "+bank.bankName;
  byId("paymentBankText").innerHTML=" "+esc(text);
  if(state.requestNo){
    byId("paymentBankBtn").style.display="none"
  }else{
    byId("paymentBankBtn").style.display="inline";
    byId("paymentBankBtn").innerHTML="Change"
  }
}
function finalizeBank(){
  var r=selectedOvtk(),bank=DATA.banks[state.selectedBank];
  if(!bank){return}
  r.paymentBank=bank;
  closeBankModal();
  showPaymentBank(bank);
  toast("Partner bank selected.","success")
}
function createRequest(){
  var r=selectedOvtk(),button=byId("createRequestBtn");
  if(!r.paymentBank){toast("Select Payment ID (Pay To) before creating the request.","warning");return}
  if(!state.requestNo){state.requestNo=String(DATA.nextRequestNumber||22001595);DATA.nextRequestNumber=Number(state.requestNo)+1}
  byId("requestNo").value=state.requestNo;
  r.iclRequestAmount=byId("iclAmount").value;
  r.requestNo=state.requestNo;
  button.disabled=true;
  showPaymentBank(r.paymentBank);
  toast("ICL Request "+state.requestNo+" created successfully.","success");
  setStatus("ICL Request "+state.requestNo+" created successfully")
}
byId("filterToggle").onclick=function(){
  var body=byId("filterBody"),open=body.className.indexOf("open")>=0;
  body.className=open?"filter-body":"filter-body open"
};
function refreshFromFilters(){
  if(!byId("tsfStructure").value){return}
  state.listPage=1;
  renderOvtkList()
}
byId("ottkNumber").onchange=refreshFromFilters;
byId("entityFrom").onchange=refreshFromFilters;
byId("statusFrom").onchange=refreshFromFilters;
byId("clearFilters").onclick=function(){
  byId("ottkNumber").value="";
  byId("entityFrom").value="";
  byId("statusFrom").value="";
  refreshFromFilters()
};
byId("ottkBody").onclick=function(e){
  var target=e.target||e.srcElement,row=target;
  while(row&&row.tagName&&row.tagName.toLowerCase()!=="tr"){row=row.parentNode}
  if(!row){return}
  var no=row.getAttribute("data-ottk");
  if(!no){return}
  selectOvtkByNo(no);
  var trs=byId("ottkBody").getElementsByTagName("tr"),i,radio;
  for(i=0;i<trs.length;i++){trs[i].className=""}
  row.className="selected";
  radio=row.getElementsByTagName("input")[0];
  if(radio){radio.checked=true}
  byId("openRequestBtn").disabled=!!selectedOvtk().requestNo
};
byId("openRequestBtn").onclick=function(){
  if(!selectedOvtk()||selectedOvtk().requestNo){return}
  state.depositSaved=false;
  state.requestNo="";
  showScreen("request");
  renderDepositWorkspace();
  openDepositPane();
  setStatus("Deposit calculator opened")
};
byId("backToList").onclick=function(){
  showScreen("selection");
  byId("resultsArea").style.display=byId("tsfStructure").value?"flex":"none";
  renderOvtkList()
};
byId("depositTab").onclick=openDepositPane;
byId("iclTab").onclick=openIclPane;
byId("bankClose").onclick=closeBankModal;byId("bankCancel").onclick=closeBankModal;byId("bankSearch").onkeyup=renderBanks;
byId("bankBody").onclick=function(e){
  var target=e.target||e.srcElement,row=target;
  while(row&&row.tagName&&row.tagName.toLowerCase()!=="tr"){row=row.parentNode}if(!row){return}
  var idx=parseInt(row.getAttribute("data-bank"),10),trs=byId("bankBody").getElementsByTagName("tr"),i;
  if(isNaN(idx)){return}state.selectedBank=idx;
  for(i=0;i<trs.length;i++){trs[i].className=""}row.className="selected";byId("bankSelect").disabled=false};
byId("bankBody").ondblclick=function(){if(state.selectedBank>=0){finalizeBank()}};byId("bankSelect").onclick=finalizeBank;
document.onkeydown=function(e){var x=e||window.event;if(x.keyCode===27){closeBankModal()}return true};
initSelections();bindTableSort();
})();
</script>
</body>
</html>
