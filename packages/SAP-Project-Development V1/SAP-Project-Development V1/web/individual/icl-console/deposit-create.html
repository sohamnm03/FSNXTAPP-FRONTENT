function displayDate(iso){
  var m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m){return iso||""}
  return m[3]+"-"+m[2]+"-"+m[1]
}
function parseIso(iso){var m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m){return null}return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]))}
function addDaysIso(iso,days){
  var d=parseIso(iso);if(!d){return iso}
  d.setDate(d.getDate()+Number(days||0));
  var y=d.getFullYear(),mo=("0"+(d.getMonth()+1)).slice(-2),da=("0"+d.getDate()).slice(-2);
  return y+"-"+mo+"-"+da
}
function calcDepositAmt(r){
  var t=Number(r.depositTradeValue!=null?r.depositTradeValue:r.ottkAmount)||0;
  var rt=Number(r.interestRate)||0,d=Number(r.noOfDays)||0;
  return t/(1+(rt*d/36000))
}

function sortData(prefix,index){
  if(prefix!=="main"&&prefix!=="bank"){return}
  var cols=prefix==="bank"?BANK_COLUMNS:MAIN_COLUMNS,rows=prefix==="bank"?DATA.banks:DATA.records,col=cols[index],direction;
  direction=state.sort.table===prefix&&state.sort.index===index&&state.sort.direction==="asc"?"desc":"asc";
  state.sort={table:prefix,index:index,direction:direction};
  rows.sort(function(a,b){
    var av=col.compute?col.compute(a):a[col.key],bv=col.compute?col.compute(b):b[col.key];
    if(col.number){av=Number(av||0);bv=Number(bv||0)}else{av=String(av||"").toLowerCase();bv=String(bv||"").toLowerCase()}
    if(av<bv){return direction==="asc"?-1:1}if(av>bv){return direction==="asc"?1:-1}return 0
  });
  if(prefix==="bank"){renderBanks()}else{state.listPage=1;renderMainList()}
  applySortClass(prefix,index,direction)
}

  for(i=0;i<rows.length;i++){

  startPage=Math.max(1,state.listPage-1);endPage=Math.min(pages,startPage+2);startPage=Math.max(1,endPage-2);
  for(p=startPage;p<=endPage;p++){html+='<button class="page-btn'+(p===state.listPage?' active':'')+'" data-page="'+p+'" type="button">'+p+'</button>'}
  html+='<button class="page-btn" data-page="next" type="button"'+(state.listPage===pages?' disabled="disabled"':'')+'>Next</button>';

function recalcDeposit(){

  var rateInput=Number(byId("depRate").value.replace(/,/g,""))||0,days=Number(byId("noOfDays").value)||0;

  byId("interestRate").value=rateFmt(rateInput);

  r.interestFrequency=byId("interestFrequency").value;
  r.noOfDays=Number(byId("noOfDays").value)||0;
  var isoStart=isoFromDisplay(byId("depStart").value);if(isoStart){r.startDate=isoStart}
  if(!r.depositId){r.depositId="DEP"+(84000+DATA.records.indexOf(r)+1)}
  if(!r.depositRequest){r.depositRequest=String(DATA.nextDepositRequest);DATA.nextDepositRequest+=1}
  if(r.requestStatus==="Open"){r.requestStatus="Deposit Created"}
  state.depositSaved=true;
  byId("depositTab").className="workspace-tab done";byId("iclTab").disabled=false;
  toast("Deposit details saved successfully.","success");
  renderDepositPane();
  renderMainList();
  setStatus("Deposit "+r.depositId+" saved")
}
function createDepositRow(){
  var r=selectedRecord();
  if(!r.depositId){r.depositId="DEP"+(84000+DATA.records.indexOf(r)+1)}
  if(!r.depositRequest){r.depositRequest=String(DATA.nextDepositRequest);DATA.nextDepositRequest+=1}
  if(r.requestStatus==="Open"){r.requestStatus="Deposit Created"}
  if(!r.depositTxn){r.depositTxn=String(DATA.nextDepositTxn);DATA.nextDepositTxn+=1}
  toast("Transaction "+r.depositTxn+" created successfully.","success");
  renderDepositPane();
  renderMainList();
  setStatus("Transaction "+r.depositTxn+" created successfully")
}
function renderIclPane(){
  var r=selectedRecord(),start=r.startDate,end=addDaysIso(start,10),amount=calcDepositAmt(r);
  byId("iclDetails").innerHTML='<div class="detail-grid">'+
    detailRow("OTTK No",r.ottkNo,"","xs")+
    detailRow("ICL Given Comp.",r.iclGivenComp,r.iclGivenName,"md")+
    detailRow("Business Area",r.businessArea,r.businessAreaName,"md")+
    detailRow("ICL Received Comp.",r.iclReceivedComp,r.iclReceivedName,"md")+
    detailRow("Deposit Bank",r.lcIssuanceBank,r.lcIssuanceBankName,"lg")+
    detailRow("Entity String",r.entityString,"","md")+'</div>';
  byId("iclHead").innerHTML=headerHtml([
    {label:"OTTK Trade Value",width:140},{label:"ICL Request Amount",width:150},{label:"Start Date",width:110},{label:"Planned End Date",width:125},
    {label:"Direct/Indirect Payment",width:230},{label:"Payment ID (Pay To)",width:170},{label:"Request No",width:110},{label:"Create",width:90}
  ],"iclEdit");
  byId("iclBody").innerHTML='<tr><td class="money">'+money(r.ottkAmount)+'</td>'+
    '<td class="editable"><input id="iclAmount" class="cell-input money" type="text" value="'+money(amount)+'"></td>'+
    '<td class="editable"><input id="iclStart" class="cell-input" type="text" value="'+esc(displayDate(start))+'"></td>'+
    '<td class="editable"><input id="iclEnd" class="cell-input" type="text" value="'+esc(displayDate(end))+'" readonly></td>'+
    '<td class="editable"><select id="paymentMode" class="cell-select"><option>01 Pay to Group Co. (Indirect)</option><option>02 Pay Direct</option></select></td>'+
    '<td class="editable"><span class="inline-actions"><button id="paymentBankBtn" class="link-button" type="button">Select bank</button>'+
    '<span id="paymentBankText"></span></span></td>'+
    '<td><input id="requestNo" class="cell-input" type="text" readonly value="'+esc(r.requestNo)+'"></td>'+
    '<td class="icon-cell"><button id="createRequestBtn" class="btn btn-primary" type="button"'+(r.requestNo?' disabled':'')+'>Create</button></td></tr>';
  byId("iclStart").onchange=function(){
    var iso=isoFromDisplay(this.value);if(iso){byId("iclEnd").value=displayDate(addDaysIso(iso,10))}
  };
  byId("paymentBankBtn").onclick=openBankModal;byId("createRequestBtn").onclick=createIclRequest;
  if(r.paymentBank){showPaymentBank(r.paymentBank,r)}
  bindTableSort()
}
function openBankModal(){
  state.selectedBank=-1;byId("bankSearch").value="";byId("bankSelect").disabled=true;renderBanks();
  byId("bankModal").className="modal-bg open"
}
function closeBankModal(){byId("bankModal").className="modal-bg"}
function renderBanks(){
  var q=byId("bankSearch").value.toLowerCase(),html="",i,j,r,c;byId("bankHead").innerHTML=headerHtml(BANK_COLUMNS,"bank");
  for(i=0;i<DATA.banks.length;i++){
    r=DATA.banks[i];if(q&&JSON.stringify(r).toLowerCase().indexOf(q)<0){continue}
    html+='<tr data-bank="'+i+'">';
    for(j=0;j<BANK_COLUMNS.length;j++){c=BANK_COLUMNS[j];html+='<td>'+esc(r[c.key])+'</td>'}
    html+="</tr>"
  }
  byId("bankBody").innerHTML=html;bindTableSort()
}
function showPaymentBank(bank,r){
  var text=(bank.partnerBank||bank.houseBank)+" - "+bank.bankName;
  byId("paymentBankText").innerHTML=" "+esc(text);
  if(r.requestNo){byId("paymentBankBtn").style.display="none"}else{byId("paymentBankBtn").style.display="inline";byId("paymentBankBtn").innerHTML="Change"}
}
function finalizeBank(){
  var r=selectedRecord(),bank=DATA.banks[state.selectedBank];if(!bank){return}
  r.paymentBank=bank;closeBankModal();showPaymentBank(bank,r);toast("Partner bank selected.","success")
}
function createIclRequest(){
  var r=selectedRecord(),button=byId("createRequestBtn");
  if(!r.paymentBank){toast("Select Payment ID (Pay To) before creating the request.","warning");return}
  if(!r.requestNo){r.requestNo=String(DATA.nextRequestNumber);DATA.nextRequestNumber+=1}
  byId("requestNo").value=r.requestNo;
  r.requestStatus="ICL Created";
  button.disabled=true;
  showPaymentBank(r.paymentBank,r);
  toast("ICL Request "+r.requestNo+" created successfully.","success");
  setStatus("ICL Request "+r.requestNo+" created successfully");
  renderMainList()
}
byId("filterToggle").onclick=function(){
  var body=byId("filterBody"),open=body.className.indexOf("open")>=0;body.className=open?"filter-body":"filter-body open"
};
function refreshFromFilters(){
  if(!byId("depCompanyCode").value||!byId("depKeyDate").value){return}
  state.listPage=1;renderMainList()
}
byId("txnNoFilter").onchange=refreshFromFilters;
byId("reqStatusFilter").onchange=refreshFromFilters;
byId("ottkNoFilter").onchange=refreshFromFilters;
byId("clearFilters").onclick=function(){
  byId("txnNoFilter").value="";byId("reqStatusFilter").value="";byId("ottkNoFilter").value="";refreshFromFilters()
};
byId("mainBody").onclick=function(e){
  var target=e.target||e.srcElement,row=target;
  while(row&&row.tagName&&row.tagName.toLowerCase()!=="tr"){row=row.parentNode}
  if(!row){return}
  var txn=row.getAttribute("data-record");if(!txn){return}
  selectRecordByTxn(txn);
  var trs=byId("mainBody").getElementsByTagName("tr"),i,radio;
  for(i=0;i<trs.length;i++){trs[i].className=""}
  row.className="selected";
  radio=row.getElementsByTagName("input")[0];if(radio){radio.checked=true}
  byId("createDepositBtn").disabled=false;
  byId("editDepositBtn").disabled=!selectedRecord().depositId
};
byId("createDepositBtn").onclick=function(){openDepositIclModal("create")};
byId("editDepositBtn").onclick=function(){openDepositIclModal("edit")};
byId("depositIclClose").onclick=closeDepositIclModal;
byId("depositIclOkay").onclick=closeDepositIclModal;
byId("depositTab").onclick=showDepositTab;
byId("iclTab").onclick=showIclTab;
byId("bankClose").onclick=closeBankModal;byId("bankCancel").onclick=closeBankModal;byId("bankSearch").onkeyup=renderBanks;
byId("bankBody").onclick=function(e){
  var target=e.target||e.srcElement,row=target;
  while(row&&row.tagName&&row.tagName.toLowerCase()!=="tr"){row=row.parentNode}
  if(!row){return}
  var idx=parseInt(row.getAttribute("data-bank"),10),trs=byId("bankBody").getElementsByTagName("tr"),i;
  if(isNaN(idx)){return}
  state.selectedBank=idx;
  for(i=0;i<trs.length;i++){trs[i].className=""}
  row.className="selected";byId("bankSelect").disabled=false
};
byId("bankBody").ondblclick=function(){if(state.selectedBank>=0){finalizeBank()}};
byId("bankSelect").onclick=finalizeBank;
document.onkeydown=function(e){var x=e||window.event;if(x.keyCode===27){closeBankModal();closeDepositIclModal()}return true};
byId("refreshBtn").onclick=function(){location.reload()};
initSelections();
byId("statusText").innerHTML="Ready - "+VERSION;
})();
</script>
</body>
</html>
