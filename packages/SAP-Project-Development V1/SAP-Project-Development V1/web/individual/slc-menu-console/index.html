<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SLC Hub -- Fourth Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
--bg:#f0f4f8;--bg2:#e8eef5;--white:#ffffff;
--border:rgba(204,224,245,0.7);--border2:#b0ceeb;--blue-dark:#1565c0;
--blue:#1e88e5;--blue-mid:#42a5f5;--blue-pale:#e3f2fd;--blue-pale2:#bbdefb;
--teal:#00acc1;--text:#0d2a4a;--text-sub:#2e6090;--text-muted:#6a9cbf;
--shadow-md:0 10px 15px -3px rgba(0,0,0,0.05),0 4px 6px -2px rgba(0,0,0,0.02),0 0 0 1px rgba(204,224,245,0.5);
--radius:10px;--radius-lg:16px;--header-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:"Inter",sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--blue-mid);border-radius:4px;}
header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between;padding:0 22px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:36px;height:36px;object-fit:contain;flex-shrink:0;}
.brand-text h1{font-size:15px;font-weight:800;color:#2c5aa0;letter-spacing:-0.01em;}
.brand-text p{font-size:10px;font-weight:700;color:#7a8ca5;letter-spacing:1.2px;text-transform:uppercase;margin-top:1px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);
animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

main{width:75%;max-width:1700px;margin:0;padding:32px 24px 48px 52px;}
.hub-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;}
.hub-sub{font-size:13px;color:var(--text-muted);font-weight:500;margin-bottom:28px;}

.group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;
color:var(--text-muted);margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--blue-pale2);
display:flex;align-items:center;gap:7px;}
.group-label:first-of-type{margin-top:0;}
.group-label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue-mid);flex-shrink:0;}

.tile-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:flex-start;}

.tile{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);
padding:20px;box-shadow:var(--shadow-md);cursor:pointer;transition:transform 0.18s ease,box-shadow 0.18s ease,border-color 0.18s ease;
display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
flex:0 0 300px;width:300px;}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
background:linear-gradient(90deg,var(--blue-dark),var(--blue-mid));transform:scaleX(0);
transform-origin:left;transition:transform 0.25s ease;}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 28px -8px rgba(21,101,192,0.22),0 0 0 1px var(--blue-pale2);
border-color:var(--blue-pale2);}
.tile:hover::before{transform:scaleX(1);}
.tile:active{transform:translateY(-1px);}

.tile.folder:hover{box-shadow:0 16px 28px -8px rgba(21,101,192,0.22),0 0 0 1px var(--blue-pale2);border-color:var(--blue-pale2);}

.tile-icon{width:40px;height:40px;border-radius:10px;background:var(--blue-pale);
display:flex;align-items:center;justify-content:center;color:var(--blue);flex-shrink:0;}
.tile.folder .tile-icon{background:var(--blue-pale);color:var(--blue);}
.tile-title{font-size:14.5px;font-weight:700;color:var(--text);}
.tile-desc{font-size:12px;color:var(--text-muted);line-height:1.5;flex:1;}
.tile-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
.tile-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
color:var(--blue-dark);background:var(--blue-pale);padding:3px 8px;border-radius:20px;}
.tile-arrow{color:var(--text-muted);font-size:15px;transition:transform 0.18s ease,color 0.18s ease;}
.tile:hover .tile-arrow{transform:translateX(3px);color:var(--blue-dark);}

.path-switch{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
color:var(--blue-dark);background:var(--white);border:1px solid var(--border2);padding:7px 13px;
border-radius:20px;text-decoration:none;transition:background 0.15s,transform 0.15s;}
.path-switch:hover{background:var(--blue-pale);transform:translateX(2px);}
.path-switch .ps-label{color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;font-size:9.5px;}
.header-right{display:flex;align-items:center;gap:14px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue-dark);
background:var(--white);border:1px solid var(--border2);padding:8px 14px;border-radius:9px;cursor:pointer;
box-shadow:var(--shadow-md);transition:background 0.15s,transform 0.15s;margin-bottom:20px;}
.back-btn:hover{background:var(--blue-pale);transform:translateX(-2px);}

.toast{position:fixed;bottom:24px;right:24px;max-width:320px;padding:12px 18px;border-radius:10px;
font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.18);display:none;align-items:center;
gap:10px;z-index:9999;background:var(--blue-pale);border:1px solid var(--blue-pale2);color:var(--blue-dark);}
.toast.show{display:flex;animation:toastUp 0.25s ease both;}
@keyframes toastUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:640px){
main{padding:20px 16px 40px;}
.tile{flex:1 1 100%;width:100%;}
}
</style>
</head>

var VIEW = { path: [] };

function escapeHtml(v){
  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function folderSvg(){
  return 'M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z';
}

// Registries of what the CURRENT view rendered: onclick carries an index into
// one of these rather than data smuggled through an HTML attribute, so
// launch()/openFolder() are handed the real item or the real path. renderAll()
// clears both before every re-render -- a registry that survived a re-render
// would hand the next click the wrong item.
var TILES = [];
var FOLDERS = [];
function registerTile(it){ TILES.push(it); return TILES.length - 1; }
function registerFolder(path){ FOLDERS.push(path.slice()); return FOLDERS.length - 1; }

function nodeAt(path){
  var node = GROUPS[path[0]];
  for (var i = 1; i < path.length; i++) { node = node.subgroups[path[i]]; }
  return node;
}
// Labels along a path, outermost first: ["Mid Office", "Manage LCs", ...].
function trailAt(path){
  var out = [], node = GROUPS[path[0]];
  out.push(node.label);
  for (var i = 1; i < path.length; i++) { node = node.subgroups[path[i]]; out.push(node.label); }
  return out;
}
// A node holds either programs ("items") or more folders ("subgroups").
function childrenOf(node){ return node.subgroups || node.items || []; }

function renderProgramTile(it){
  return '<div class="tile" onclick="launch('+registerTile(it)+')">'
    + '<div class="tile-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="'+it.icon+'"/></svg></div>'
    + '<div class="tile-title">'+escapeHtml(it.title)+'</div>'
    + '<div class="tile-desc">'+escapeHtml(it.desc)+'</div>'
    + '<div class="tile-foot"><span class="tile-tag">'+escapeHtml(it.tag)+'</span><span class="tile-arrow">&#8594;</span></div>'
    + '</div>';
}

function renderFolderTile(path){
  var sg = nodeAt(path);
  var kids = childrenOf(sg);
  var desc;
  if (!kids.length) {
    desc = 'Not set up yet.';
  } else if (sg.subgroups) {
    desc = kids.length + ' folder' + (kids.length !== 1 ? 's' : '') + ' in this area.';
  } else {
    desc = kids.length + ' screen' + (kids.length !== 1 ? 's' : '') + ' in this sub-process.';
  }
  return '<div class="tile folder" onclick="openFolder('+registerFolder(path)+')">'
    + '<div class="tile-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="'+folderSvg()+'"/></svg></div>'
    + '<div class="tile-title">'+escapeHtml(sg.label)+'</div>'
    + '<div class="tile-desc">'+escapeHtml(desc)+'</div>'
    + '<div class="tile-foot"><span class="tile-tag">Folder</span><span class="tile-arrow">&#8594;</span></div>'
    + '</div>';
}

function renderHome(){
  var html = '<div class="hub-title">SLC</div>'
           + '<div class="hub-sub">Applications on their own dedicated OData service. '
           + 'Anything that reaches SAP through the dynamic gateway lives on the Dynamic Gateway hub.</div>';
  GROUPS.forEach(function(g, gi){
    html += '<div class="group-label">'+escapeHtml(g.label)+'</div><div class="tile-grid">';
    if (g.items) {
      html += g.items.map(renderProgramTile).join("");
    } else {
      g.subgroups.forEach(function(sg, si){ html += renderFolderTile([gi, si]); });
    }
    html += '</div>';
  });
  document.getElementById("main").innerHTML = html;
}

function renderFolderDetail(path){
  var node = nodeAt(path);
  var trail = trailAt(path);
  var kids = childrenOf(node);
  // Back goes up exactly one level: to the parent folder, or home from the top.
  var backLabel = path.length > 2 ? trail[trail.length - 2] : "SLC Menu Path";
  var html = '<div class="back-btn" onclick="goUp()">&#8592; Back to '+escapeHtml(backLabel)+'</div>'
    + '<div class="hub-title">'+escapeHtml(node.label)+'</div>'
    + '<div class="hub-sub">'+escapeHtml(trail.slice(0, -1).join(" \u203a "))+'. Pick a '
    + (node.subgroups ? 'folder' : 'screen') + ' below.</div>'
    + '<div class="tile-grid">';
  if (node.subgroups) {
    kids.forEach(function(sg, si){ html += renderFolderTile(path.concat(si)); });
  } else {
    html += kids.map(renderProgramTile).join("");
  }
  html += '</div>';
  document.getElementById("main").innerHTML = html;
}

function renderAll(){
  TILES = [];
  FOLDERS = [];
  if (!VIEW.path.length) { renderHome(); } else { renderFolderDetail(VIEW.path); }
}

// An empty folder does not open a dead-end screen -- it says it is empty, the
// same way an un-wired program tile does.
function openFolder(folderIdx){
  var path = FOLDERS[folderIdx];
  if (!path) { return; }
  var node = nodeAt(path);
  if (!childrenOf(node).length) { showToast(node.label + " has nothing in it yet."); return; }
  VIEW = { path: path.slice() };
  renderAll();
  window.scrollTo(0,0);
}
function goUp(){
  VIEW = { path: VIEW.path.length > 2 ? VIEW.path.slice(0, -1) : [] };
  renderAll();
  window.scrollTo(0,0);
}
function goHome(){
  VIEW = { path: [] };
  renderAll();
  window.scrollTo(0,0);
}

function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.className="toast show";
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},2200);
}
// ---------------------------------------------------------------------
// Navigation. This page is the TOP-LEVEL HTML application: it calls the
// other applications by URL. There is deliberately no "sapevent:" branch
// and no isSapGui() sniff -- nothing here runs inside an ABAP HTML viewer
// control, so no action string is ever handed to on_sapevent. (L-299
// records what the sapevent build did instead, and why it logged scheme
// errors when opened in a browser.)
//
// A tile with a "url" navigates straight to it. Each sibling console is
// served by its own proxy.py on its own port (8765 OTTK, 8766 DTTK,
// 8767 Deal ID, 8768 TF Upload, 8770 TF Manage), so a tile only works while
// that console's proxy is running -- if it is not, the browser reports a
// refused connection. That is the console being down, not a fault in this page.
//
// A tile with no "url" has no application behind it yet and says so
// rather than failing silently. Its "action" name stays in GROUPS as a
// record of the intent, unused until something is wired up.
// ---------------------------------------------------------------------
function launch(tileIdx){
  var it = TILES[tileIdx];
  if (!it) { return; }
  if (it.url) {
    showToast("Opening " + it.title + "\u2026");
    window.location.href = it.url;
    return;
  }
  showToast(it.title + " is not wired up yet.");
}

renderAll();
</script>
</body>
</html>
