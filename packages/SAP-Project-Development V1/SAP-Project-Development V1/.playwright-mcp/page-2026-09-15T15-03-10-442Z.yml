            - generic [ref=f3e743]: What this page cannot show you
            - generic [ref=f3e745]:
              - text: "IsCommitted / IsRolledBack are not here, and cannot be: they live only on an action's own response shape, never on the persisted CallLog entity, so no later"
              - code [ref=f3e746]: GET
              - text: can recover them (L-525). A call's
              - code [ref=f3e747]: ExecStatus
              - text: tells you the dispatch outcome, not whether the LUW committed. A step marked S can still have changed nothing —
              - code [ref=f3e748]: ExecStatus
              - text: answers "did the dispatch work", while
              - code [ref=f3e749]: ErrorCategory BUSINESS
              - text: on the call means the target's own RETURN reported a failure.
