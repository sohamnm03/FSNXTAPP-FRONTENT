                  - code [ref=f35e146]: TARGET
                  - text: the target failed technically ·
                  - code [ref=f35e147]: BUSINESS
                  - text: dispatched fine, but the target's own
                  - code [ref=f35e148]: RETURN
                  - text: reported an error.
                  - generic [ref=f35e149]:
                    - code [ref=f35e150]: ExecStatus S
