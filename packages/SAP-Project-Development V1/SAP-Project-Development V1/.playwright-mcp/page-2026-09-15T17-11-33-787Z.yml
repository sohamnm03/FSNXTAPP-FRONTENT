                  - code [ref=f42e146]: TARGET
                  - text: the target failed technically ·
                  - code [ref=f42e147]: BUSINESS
                  - text: dispatched fine, but the target's own
                  - code [ref=f42e148]: RETURN
                  - text: reported an error.
                  - generic [ref=f42e149]:
                    - code [ref=f42e150]: ExecStatus S
