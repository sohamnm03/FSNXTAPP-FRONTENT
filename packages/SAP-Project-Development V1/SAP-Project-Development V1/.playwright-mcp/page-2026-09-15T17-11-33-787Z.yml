            - generic [ref=f42e123]: "# Through the proxy: no token, no credentials, no TLS fuss. $base = \"https://vhnlqds4ap01.sap.niififl.in:44300/sap/opu/odata4/sap/zfs_sb_dyngw_o4_api/srvd_a2x/sap/zfs_sd_dyngw/0001\" $ns = \"com.sap.gateway.srvd_a2x.zfs_sd_dyngw.v0001\" # Build the inner JSON by hand: ConvertTo-Json collapses a 1-element array to an # object, and the gateway then answers \"Invalid JSON\" (L-315). $body = @{ TargetName = \"T000\" FieldsJson = '[\"MANDT\",\"MTEXT\"]' FilterJson = \"\" OrderByJson = \"\" MaxRows = 3 SkipRows = 0 RequestId = \"\" } | ConvertTo-Json $r = Invoke-RestMethod -Method Post -ContentType \"application/json\" ` -Uri \"$base/CallLog/$ns.RunQuery?sap-client=100\" -Body $body $r.ExecStatus # S $r.RowsJson | ConvertFrom-Json"
        - generic [ref=f42e124]:
